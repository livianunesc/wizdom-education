 finalidade predominante de uma notícia jornalística?",["Ensinar uma receita","Defender sempre uma tese pessoal","Narrar exclusivamente fatos fictícios","Informar sobre acontecimentos de interesse público"],3,"A notícia tem finalidade predominantemente informativa, embora escolhas editoriais influenciem sua construção."],["Leia: “Embora chovesse, a equipe continuou o jogo.” Qual relação a palavra “embora” estabelece?",["Causa","Concessão","Conclusão","Finalidade"],1,"A chuva cria uma expectativa de interrupção, mas o jogo continua; essa quebra de expectativa expressa concessão."],["Um anúncio diz: “A cidade não dorme. Seus trabalhadores também não.” Ao aproximar as duas frases, o texto sugere principalmente:",["Uma descrição neutra do céu noturno","Que cidades são organismos biologicamente vivos","Uma crítica ao trabalho contínuo, por meio da personificação da cidade","Uma regra de que todos devem trabalhar à noite"],2,"A cidade é personificada. A segunda frase desloca a imagem para as pessoas e permite uma leitura crítica das condições de trabalho."]],"por-linguagem":[["Em “Participe da campanha. Doe um livro!”, qual função da linguagem predomina?",["Conativa, voltada a influenciar o destinatário","Metalinguística, voltada ao código","Referencial, sem apelo ao leitor","Fática, voltada apenas ao contato"],0,"Os verbos no imperativo convocam o destinatário a agir, característica da função conativa."],["Uma pessoa usa “a gente vai” numa conversa e “nós iremos” num documento. Qual conceito explica essa escolha?",["Erro inevitável de concordância","Ausência de domínio linguístico","Adequação do registro ao contexto","Superioridade linguística de uma região"],2,"Falantes ajustam o registro à situação comunicativa. Variação linguística não se confunde com incapacidade."],["Em um poema que explora rimas, ritmo e a disposição das palavras, qual fator sustenta a predominância da função poética?",["A presença obrigatória de opinião política","A atenção à forma da própria mensagem","A eliminação de toda ambiguidade","O uso exclusivo de palavras antigas"],1,"A função poética destaca a elaboração da mensagem: sons, combinações, ritmo e organização visual."]],"por-literatura":[["Qual evento é um marco do Modernismo brasileiro?",["Semana de Arte Moderna de 1922","Independência do Brasil em 1822","Fundação da Academia Brasileira de Letras em 1897","Publicação de Os Lusíadas em 1572"],0,"A Semana de 1922 tornou-se um marco simbólico do movimento modernista no Brasil."],["Qual procedimento se associa à primeira fase modernista brasileira?",["Imitação obrigatória dos modelos clássicos","Proibição da linguagem cotidiana","Eliminação dos temas nacionais","Experimentação formal e valorização crítica da linguagem brasileira"],3,"Modernistas experimentaram formas e linguagem coloquial e repensaram criticamente a identidade nacional."],["Uma narrativa regionalista de 1930 aborda seca, desigualdade e relações de poder no campo. Qual leitura é mais adequada?",["O espaço rural aparece apenas como paisagem decorativa","O contexto social participa da construção dos conflitos humanos","A obra só permite interpretação como documento estatístico","O regionalismo exclui conflitos de dimensão universal"],1,"O romance de 1930 frequentemente relaciona conflitos das personagens a estruturas sociais, sem reduzir a literatura a um relatório."]],"red-tese":[["Em uma redação dissertativo-argumentativa, a tese é:",["Uma citação obrigatória","A repetição integral do tema","O posicionamento central que será defendido","Somente a proposta de intervenção"],2,"A tese expressa o ponto de vista que os argumentos do texto irão sustentar."],["Tema: “Desafios para combater a evasão escolar no Brasil”. Qual tese delimita melhor uma discussão?",["A escola existe há muito tempo.","A pobreza e a falta de acolhimento escolar dificultam a permanência dos alunos.","Os estudantes usam materiais escolares.","O Brasil possui várias cidades."],1,"A frase apresenta dois fatores relacionados
